services:
  app:
    build:
      context: .
      args:
        VITE_API_URL: http://localhost:5601
    ports:
      - "5600:5600"
      - "5601:5601"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      DATABASE_URL: postgresql://postgres:password@host.docker.internal:5435/master_app?schema=public
      APP_DOMAIN: ${APP_DOMAIN:-localhost}
      PORT: "5601"
      SMTP_HOST: ${SMTP_HOST:-smtp-mail.outlook.com}
      SMTP_USER: ${SMTP_USER:-noreply@nanoheal.com}
      SMTP_PWD: ${SMTP_PWD:-}
